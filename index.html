<!doctype html>
<html lang="es-UY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183eec"><meta name="description" content="Prototipo de planes para conocer gente en Montevideo."><title>Pinta · Planes en Montevideo</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17203b;background:#f3f5fa;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{min-height:46px;border:0;border-radius:14px;padding:11px 17px;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f3b52c;outline-offset:3px}header{background:#fff;border-bottom:1px solid #e1e5ee;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:30px;font-weight:850;letter-spacing:-1.6px;color:#183eec}.location{font-size:14px;color:#515b73}main{max-width:1040px;margin:auto;padding:26px 20px 100px}.demo{font-size:14px;background:#e7ecff;color:#2442a9;border-radius:12px;padding:12px 15px;margin:0 0 27px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1.4px;margin:0 0 8px;line-height:1.15}.muted{color:#606a7e}.intro{margin:0 0 24px}.primary{background:#183eec;color:white}.secondary{background:#edf0f7;color:#293551}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{background:#fff;border:1px solid #dce1ec;border-radius:30px;font-size:14px}.chip[aria-pressed=true]{background:#17203b;color:white;border-color:#17203b}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.row select{max-width:55%;border:1px solid #dce1ec;border-radius:12px;padding:10px;background:white;color:#283650}.count{font-size:14px;color:#606a7e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e1e5ee;border-radius:22px;padding:23px;display:flex;flex-direction:column;align-items:flex-start}.category{font-size:14px;font-weight:700;color:#183eec;background:#edf1ff;border-radius:9px;padding:7px 10px}.card h2{font-size:23px;line-height:1.25;letter-spacing:-.5px;margin:17px 0 12px}.meta{color:#58637a;margin:0 0 8px;font-size:15px}.card-footer{margin-top:auto;padding-top:20px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.spots{font-size:14px;font-weight:650}.card-footer button{background:#edf1ff;color:#183eec}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #e1e5ee;display:flex;justify-content:center;gap:12px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.nav button{font-size:14px;background:transparent;color:#5a647b}.nav button[aria-pressed=true]{color:#183eec;background:#edf1ff}.empty{grid-column:1/-1;text-align:center;padding:45px 18px;background:white;border-radius:22px}dialog{border:0;border-radius:24px;width:min(520px,calc(100% - 24px));padding:25px;color:#17203b;max-height:90dvh;overflow:auto}dialog::backdrop{background:#111b3a99}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-top h2{font-size:25px;margin:0}.close{background:#eef0f6;font-size:22px;padding:4px 14px}label{display:block;font-weight:600;font-size:14px;margin:17px 0 6px}input,select,textarea{width:100%;border:1px solid #cfd6e4;border-radius:10px;padding:12px;background:white;color:#17203b}textarea{resize:vertical}.wide{width:100%;margin-top:20px}.people{padding:14px;background:#f3f5fa;border-radius:12px;line-height:1.8}.notice{font-size:14px;color:#657086;line-height:1.5}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#17203b;color:white;padding:14px 20px;border-radius:14px;z-index:4;width:max-content;max-width:90%;font-size:14px}.toast:empty{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.heading>.primary{display:none}main{padding-top:20px}.card{padding:20px}.brand{font-size:28px}.intro{font-size:16px}.row{align-items:center}.nav{gap:2px;justify-content:space-around}.nav button{padding:11px 12px}}
</style></head><body>
<header><span class="brand">pinta<span style="color:#eea923">.</span></span><span class="location">Montevideo, Uruguay</span></header>
<main><p class="demo">DEMO · Planes y personas ficticios. Los cambios se reinician al recargar.</p><div class="heading"><h1>¿Qué pinta hacer?</h1><button class="primary" data-create>+ Crear un plan</button></div><p class="intro muted">Un plan cerca. Gente nueva. Vos te sumás.</p><div class="filters" id="filters" aria-label="Actividad"></div><div class="row"><span class="count" id="count" aria-live="polite"></span><select id="zone" aria-label="Filtrar por barrio"><option value="">Todos los barrios</option>Palermo</option>Parque Rodó</option>Pocitos</option>Centro</option></select></div><section class="grid" id="plans" aria-label="Planes disponibles"></section></main>
<nav class="nav" aria-label="Navegación principal"><button id="explore" aria-pressed="true">Explorar</button><button data-create>+ Crear plan</button><button id="mine" aria-pressed="false">Mis planes</button></nav>
<dialog id="detail"><div class="dialog-top"><h2 id="detail-title"></h2><button class="close" aria-label="Cerrar" data-close>×</button></div><div id="detail-body"></div><button id="join" class="primary wide"></button><p class="notice">Esto es una prueba: no se contacta con personas reales.</p></dialog>
<dialog id="create"><div class="dialog-top"><h2>Armá tu plan</h2><button class="close" aria-label="Cerrar" data-close>×</button></div><p class="notice">Creá un ejemplo para probar cómo aparecería.</p><form id="form"><label for="title">¿Qué querés hacer?</label><input id="title" name="title" maxlength="70" placeholder="Una vuelta en patines" required><label for="category">Actividad</label><select id="category" name="category"><option>Deporte</option><option>Comida</option><option>Juegos</option><option>Paseos</option></select><label for="neighborhood">Barrio</label><select id="neighborhood" name="zone"><option>Palermo</option><option>Parque Rodó</option><option>Pocitos</option><option>Centro</option></select><label for="place">Punto de encuentro público</label><input id="place" name="place" maxlength="100" placeholder="Entrada principal del parque" required><label for="date">Día y hora</label><input id="date" name="date" type="datetime-local" required><label for="capacity">Cupos totales, incluyéndote</label><input id="capacity" name="capacity" type="number" min="2" max="30" value="6" required><label for="description">Contá un poco más</label><textarea id="description" name="description" maxlength="400" rows="3" placeholder="Qué llevar, nivel, costo por persona…" required></textarea><button class="primary wide" type="submit">Crear plan de prueba</button></form></dialog><div class="toast" id="toast" role="status"></div>
<script>
const plans=[
{id:1,title:'Nos falta uno para el fútbol',category:'Deporte',zone:'Palermo',place:'Cancha de ejemplo en Palermo',date:'Hoy · 19:00',capacity:10,people:['Nico','Santi','Leo','Fede','Bruno','Lucas','Diego','Juan','Mateo'],description:'Partido tranquilo de fútbol 5. Cualquier nivel es bienvenido. El costo de la cancha se coordinaría entre el grupo.'},
{id:2,title:'Mate y charla en la rambla',category:'Paseos',zone:'Parque Rodó',place:'Punto de ejemplo en la rambla de Parque Rodó',date:'Mañana · 17:30',capacity:6,people:['Vale','Flor','Dani'],description:'Un rato para conocernos al aire libre. Traé tu mate o algo para tomar. Actividad de ejemplo sin costo.'},
{id:3,title:'Una vuelta en patines',category:'Deporte',zone:'Pocitos',place:'Punto de ejemplo en la rambla de Pocitos',date:'Sábado · 16:00',capacity:8,people:['Cami','Agus'],description:'Paseo a ritmo suave. Traé tus patines y protecciones. Si recién empezás, también te podés sumar.'},
{id:4,title:'Juegos de mesa y algo rico',category:'Juegos',zone:'Centro',place:'Café de ejemplo en el Centro',date:'Sábado · 18:00',capacity:5,people:['Lu','Mati','Sofi'],description:'Cartas y juegos fáciles para romper el hielo. No hace falta saber jugar. Cada persona pagaría su consumo.'},
{id:5,title:'Salir a merendar',category:'Comida',zone:'Palermo',place:'Cafetería de ejemplo en Palermo',date:'Domingo · 17:00',capacity:4,people:['Ana'],description:'Una merienda y buena charla para conocer gente del barrio. Cada persona pagaría su consumo.'}];
let activity='Todos',onlyMine=false,selected=null,timer;const joined=new Set(),owned=new Set();const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',3500)}
function render(){document.querySelectorAll('#filters button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===activity));$('explore').setAttribute('aria-pressed',!onlyMine);$('mine').setAttribute('aria-pressed',onlyMine);const list=plans.filter(p=>(activity==='Todos'||p.category===activity)&&(!$('zone').value||p.zone===$('zone').value)&&(!onlyMine||joined.has(p.id)));$('count').textContent=`${list.length} ${onlyMine?'de tus planes':'planes para descubrir'}`;$('plans').innerHTML=list.length?list.map(p=>`<article class="card"><span class="category">${esc(p.category)}</span><h2>${esc(p.title)}</h2><p class="meta">${esc(p.date)}</p><p class="meta">${esc(p.zone)} · Montevideo</p><div class="card-footer"><span class="spots">${joined.has(p.id)?(owned.has(p.id)?'Organizado por vos':'Ya estás en el plan'):p.capacity-p.people.length+' cupos libres'}</span><button data-id="${p.id}" aria-label="Ver plan: ${esc(p.title)}">Ver plan ↗</button></div></article>`).join(''):'<div class="empty"><h2>No hay planes por acá todavía</h2><p class="muted">Probá otra actividad o barrio, o creá el primero.</p><button class="primary" data-create>+ Crear un plan</button></div>'}
function show(id){selected=plans.find(p=>p.id===id);const p=selected;$('detail-title').textContent=p.title;$('detail-body').innerHTML=`<p class="category">${esc(p.category)} · ${esc(p.zone)}</p><p><strong>${esc(p.date)}</strong></p><p class="muted">${esc(p.place)}</p><p>${esc(p.description)}</p><h3>Quiénes se suman · ${p.people.length}/${p.capacity}</h3><div class="people">${p.people.map(esc).join(' · ')}</div>`;$('join').textContent=owned.has(id)?'Este plan lo organizás vos':joined.has(id)?'Salir del plan':p.people.length>=p.capacity?'Plan completo':'Sumarme al plan';$('join').disabled=owned.has(id)||(!joined.has(id)&&p.people.length>=p.capacity);if(!$('detail').open)$('detail').showModal()}
['Todos','Deporte','Comida','Juegos','Paseos'].forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{activity=c;render()};$('filters').append(b)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-create'))$('create').showModal();if(b.hasAttribute('data-close'))b.closest('dialog').close();if(b.dataset.id)show(Number(b.dataset.id))});$('zone').onchange=render;$('explore').onclick=()=>{onlyMine=false;render()};$('mine').onclick=()=>{onlyMine=true;activity='Todos';$('zone').value='';render()};$('join').onclick=()=>{const p=selected;if(owned.has(p.id))return;if(joined.has(p.id)){joined.delete(p.id);p.people=p.people.filter(n=>n!=='Vos');notify('Saliste del plan de prueba')}else if(p.people.length<p.capacity){joined.add(p.id);p.people.push('Vos');notify('¡Te sumaste al plan de prueba!')}show(p.id);render()};
$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const when=new Date(f.get('date'));if(when<=new Date()){ $('date').setCustomValidity('Elegí una fecha futura.');$('date').reportValidity();return}const title=f.get('title').trim(),place=f.get('place').trim(),description=f.get('description').trim();if(!title||!place||!description){notify('Completá el título, lugar y descripción.');return}const p={id:Date.now(),title,place,description,category:f.get('category'),zone:f.get('zone'),date:when.toLocaleString('es-UY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),capacity:Number(f.get('capacity')),people:['Vos']};plans.unshift(p);joined.add(p.id);owned.add(p.id);activity='Todos';onlyMine=true;$('zone').value='';$('create').close();e.target.reset();render();notify('Tu plan de prueba ya está en Mis planes')};$('date').oninput=()=> $('date').setCustomValidity('');render();
</script></body></html>
