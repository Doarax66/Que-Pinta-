name: Crear APK de prueba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apk-source

    steps:
      - uses: actions/checkout@v4

      - name: Extraer proyecto
        working-directory: .
        run: unzip -q Que-Pinta-Actualizado.zip -d apk-source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm --prefix mobile install --no-fund --no-audit

      - name: Comprobar la web
        run: node scripts/checks.cjs

      - name: Preparar la app
        run: node scripts/prepare-android.mjs

      - name: Crear proyecto Android
        working-directory: apk-source/mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: apk-source/mobile/android
        run: bash gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Que-Pinta-APK-de-prueba
          path: apk-source/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar versiones de dependencias
        uses: actions/upload-artifact@v4
        with:
          name: Que-Pinta-package-lock
          path: apk-source/mobile/package-lock.json
